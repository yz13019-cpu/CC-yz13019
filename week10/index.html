<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound visualization</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
</head>
<body>
  <p>
    Q: head<br>
    W: left arm<br>
    E: right arm<br>
    A: belly<br>
    S: left leg<br>
    D: right leg<br>    
    Space: start/stop<br>
    B: turn the drum beat on/off<br>
    Move the mouse: left lowers the pitch<br>
    right raises the pitch<br>

  </p>
  <script src="sketch.js"></script>
</body>
</html>
